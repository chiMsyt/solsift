[project]
name = "solsift"
version = "0.1.0"
description = "Read a job board so you do not have to. Removes what is disqualifying, leaves the judgment to you."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["job-search", "scraping", "jobs", "cli", "automation"]
dependencies = ["playwright>=1.40", "rich>=13.0", "defusedxml>=0.7"]

[project.scripts]
solsift = "solsift.cli:main"

[project.urls]
Homepage = "https://github.com/chiMsyt/solsift"
Issues = "https://github.com/chiMsyt/solsift/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solsift"]

[dependency-groups]
dev = ["pytest>=8.0"]
